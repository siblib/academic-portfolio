<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — ManuscriptReady Client Portal</title>
  <meta name="description" content="ManuscriptReady Client Portal: track editorial timelines, APA 7 formatting progress, and download completed documents.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Merriweather:ital,wght@0,400;0,700;0,900;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>
  <!-- Portal Header -->
  <header class="portal-header">
    <div class="container nav-wrap">
      <a href="/" class="wordmark">Manuscript<span>Ready</span></a>
      <div class="portal-user">
        <span class="text-muted" id="user-email"></span>
        <button id="logout-btn" class="btn btn-secondary">Log out</button>
      </div>
    </div>
  </header>

  <!-- Main Content Protected Area -->
  <main class="container">
    <!-- Structural Flash Prevention Wrapper -->
    <div id="portal" hidden>
      <div class="portal-head">
        <h1>Welcome back, <span id="user-first-name">…</span></h1>
        <a href="/new-project" class="btn btn-primary">+ New Project</a>
      </div>

      <section aria-labelledby="projects-heading">
        <h2 id="projects-heading" class="section-title">My Projects</h2>
        
        <div id="projects-table-wrap" class="table-wrap">
          <table class="projects-table">
            <thead>
              <tr>
                <th>Project</th>
                <th>Service</th>
                <th>Due</th>
                <th>Status</th>
                <th>Files</th>
              </tr>
            </thead>
            <tbody id="projects-tbody"></tbody>
          </table>
        </div>

        <div id="empty-state" class="empty-state" hidden>
          <p>No projects yet — your manuscripts and their live status will appear here.</p>
          <a href="/new-project" class="btn btn-primary">Submit your first manuscript</a>
        </div>
      </section>
    </div>

    <!-- Pre-auth loader to avoid flash of content -->
    <p id="portal-loading" class="portal-loading">Checking your session…</p>
  </main>

  <script type="module" src="/js/dashboard.js"></script>
</body>
</html>
